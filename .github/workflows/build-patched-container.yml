name: Build Patched Sonarr Container

on:
  workflow_dispatch:
  push:
    branches:
      - v4-skip-unaired

permissions:
  contents: read
  packages: write

concurrency:
  group: patched-sonarr-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAMEWORK: net6.0
  SONARR_VERSION: 4.0.19.2979
  BRANCH: v4-skip-unaired
  IMAGE_NAME: ghcr.io/jitterjames/sonarr

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out patched source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up frontend tools
        uses: volta-cli/action@v4

      - name: Run unaired-release tests
        run: >-
          dotnet test src/NzbDrone.Core.Test/Sonarr.Core.Test.csproj
          --configuration Release
          --filter FullyQualifiedName~UnairedEpisodeSpecificationFixture

      - name: Build Intel/AMD backend
        run: >-
          ./build.sh --backend --packages
          --runtime linux-musl-x64
          --framework "${FRAMEWORK}"

      - name: Build ARM64 backend
        run: >-
          ./build.sh --backend --packages
          --runtime linux-musl-arm64
          --framework "${FRAMEWORK}"

      - name: Build web interface
        run: |
          yarn install --frozen-lockfile --network-timeout 120000
          yarn build --env production

      - name: Prepare container files
        run: |
          mkdir -p container/amd64 container/arm64
          cp -a "_artifacts/linux-musl-x64/${FRAMEWORK}/Sonarr/." container/amd64/
          cp -a "_artifacts/linux-musl-arm64/${FRAMEWORK}/Sonarr/." container/arm64/
          cp -a _output/UI container/amd64/UI
          cp -a _output/UI container/arm64/UI
          cp distribution/patched-container/Dockerfile container/Dockerfile

      - name: Set up emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:skip-unaired
            ${{ env.IMAGE_NAME }}:4.0.19.2979-skip-unaired
          cache-from: type=gha
          cache-to: type=gha,mode=max
